name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle.kts
      - name: Inspect runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || true
      - name: Build and test
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Gradle build failed after 4 attempts"
              exit 1
            fi
            echo "Gradle attempt $attempt failed; retrying after 20 seconds"
            sleep 20
          done
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minogasa-night-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download as preview release
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-apk-${GITHUB_RUN_ID}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk#minogasa-night-preview.apk \
            --title "みのがさナイト 開発版 APK ${GITHUB_RUN_ID}" \
            --notes "開発版APK。Android実機確認前、本番未公開。" \
            --prerelease \
            --target "$GITHUB_SHA"
