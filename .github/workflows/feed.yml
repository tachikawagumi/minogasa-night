name: Validate and refresh program feed
on:
  push:
    paths: ['data/manual-approved.json', 'data/ai-candidates.json', 'config/**', 'scripts/**', 'tests/**', 'public/**', '.github/workflows/feed.yml']
  pull_request:
    paths: ['data/**', 'config/**', 'scripts/**', 'tests/**', 'public/**', '.github/workflows/feed.yml']
  workflow_dispatch:
  schedule:
    # Monday and Thursday 09:00 Asia/Tokyo.
    - cron: '0 0 * * 1,4'
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'program-feed-publish' || format('program-feed-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/feed.py --validate
  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      baseline_sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save validated pre-refresh snapshot revision
        id: baseline
        run: |
          python scripts/feed.py --validate
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare guarded AI and anime update
        run: |
          python scripts/autopublish.py
          python scripts/discovery.py --plan --quality
      - name: Commit verified candidate
        id: commit
        run: |
          git config user.name 'minogasa-night[bot]'
          git config user.email 'minogasa-night[bot]@users.noreply.github.com'
          git add data/discovered-candidates.json data/hybrid-audit.json data/search-plan.json data/collection-quality.json data/anime-cache.json data/ai-state.json data/ai-held.json data/current-db.json data/update-result.json data/update-history.json public/v1/programs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare validated automatic program update'
            git push
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cat data/update-result.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Collection quality: see data/collection-quality.json for held priority programs and research gaps.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failure report without publishing data
        if: failure()
        run: |
          git config user.name 'minogasa-night[bot]'
          git config user.email 'minogasa-night[bot]@users.noreply.github.com'
          python -c "import json; from pathlib import Path; p=Path('data/update-result.json'); r=json.loads(p.read_text()); r.update(status='failed',publicationVerified=False,previousPublicPreserved=True,error=r.get('error') or 'Refresh, quality validation or commit failed; see Actions logs and collection-quality.json'); p.write_text(json.dumps(r,ensure_ascii=False,indent=2))"
          if [ -f data/hybrid-audit.json ]; then git add data/hybrid-audit.json; fi
          git add data/discovered-candidates.json data/collection-quality.json data/update-result.json data/update-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record blocked program update'
            git push
          fi
          cat data/update-result.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: update-failure-${{ github.run_id }}
          path: data/update-result.json
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      pages_deployed: ${{ steps.deployment.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse to publish a superseded update
        run: test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify exact published JSON and preserve last successful version
        run: |
          cp public/v1/programs.json "$RUNNER_TEMP/expected-feed.json"
          python scripts/verify_deployment.py
          git fetch origin main
          git checkout -B publication-marker origin/main
          cmp public/v1/programs.json "$RUNNER_TEMP/expected-feed.json"
          python scripts/verify_deployment.py --ack
          python scripts/operations_status.py
          git config user.name 'minogasa-night[bot]'
          git config user.email 'minogasa-night[bot]@users.noreply.github.com'
          git add data/operations-status.json data/collection-quality.json data/last-published.json data/publication.json data/update-result.json data/update-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Confirm Pages publication and last good snapshot'
            git push origin HEAD:main
          fi
          cat data/publication.json >> "$GITHUB_STEP_SUMMARY"
  rollback:
    if: always() && !cancelled() && needs.refresh.result == 'success' && needs.deploy.result == 'failure' && needs.deploy.outputs.pages_deployed == 'success'
    needs: [refresh, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore the validated pre-refresh snapshot, not an older last-published file
        env:
          BASELINE_SHA: ${{ needs.refresh.outputs.baseline_sha }}
          REFRESH_SHA: ${{ needs.refresh.outputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REFRESH_SHA"
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          git show "$BASELINE_SHA:public/v1/programs.json" > public/v1/programs.json
          git show "$BASELINE_SHA:data/current-db.json" > data/current-db.json
          python scripts/feed.py --validate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-rollback
          path: public
          retention-days: 1
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback
      - name: Record rollback
        run: |
          python scripts/verify_deployment.py
          python -c "import json; from pathlib import Path; p=Path('data/update-result.json'); r=json.loads(p.read_text()); r.update(status='rolled_back', publicationVerified=False, error='New Pages snapshot failed verification; pre-refresh snapshot restored and verified'); p.write_text(json.dumps(r,ensure_ascii=False,indent=2))"
          git config user.name 'minogasa-night[bot]'
          git config user.email 'minogasa-night[bot]@users.noreply.github.com'
          git add public/v1/programs.json data/current-db.json data/update-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Roll back unverified Pages publication'
            git push
          fi
          echo "Publication failed and rollback was attempted. See failed deploy job." >> "$GITHUB_STEP_SUMMARY"
