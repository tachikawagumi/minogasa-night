name: Validate and refresh program feed
on:
  push:
    paths: ['data/manual-approved.json', 'data/ai-candidates.json', 'config/**', 'scripts/**', 'tests/**', 'public/**', '.github/workflows/feed.yml']
  pull_request:
    paths: ['data/**', 'config/**', 'scripts/**', 'tests/**', 'public/**', '.github/workflows/feed.yml']
  workflow_dispatch:
  schedule:
    # Monday and Thursday 09:00 Asia/Tokyo.
    - cron: '0 0 * * 1,4'
permissions:
  contents: read
concurrency:
  group: program-feed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/feed.py --validate
  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare guarded AI and anime update
        run: python scripts/autopublish.py
      - name: Commit verified candidate
        id: commit
        run: |
          git config user.name 'minogasa-night[bot]'
          git config user.email 'minogasa-night[bot]@users.noreply.github.com'
          git add data/anime-cache.json data/ai-state.json data/ai-held.json data/current-db.json data/update-result.json data/update-history.json public/v1/programs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare validated automatic program update'
            git push
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cat data/update-result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failure report without publishing data
        if: failure()
        run: |
          git config user.name 'minogasa-night[bot]'
          git config user.email 'minogasa-night[bot]@users.noreply.github.com'
          git add data/update-result.json data/update-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record blocked program update'
            git push
          fi
          cat data/update-result.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: update-failure-${{ github.run_id }}
          path: data/update-result.json
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify exact published JSON and preserve last successful version
        run: |
          cp public/v1/programs.json "$RUNNER_TEMP/expected-feed.json"
          python scripts/verify_deployment.py
          git fetch origin main
          git checkout -B publication-marker origin/main
          cmp public/v1/programs.json "$RUNNER_TEMP/expected-feed.json"
          python scripts/verify_deployment.py --ack
          git config user.name 'minogasa-night[bot]'
          git config user.email 'minogasa-night[bot]@users.noreply.github.com'
          git add data/last-published.json data/publication.json data/update-result.json data/update-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Confirm Pages publication and last good snapshot'
            git push origin HEAD:main
          fi
          cat data/publication.json >> "$GITHUB_STEP_SUMMARY"
  rollback:
    if: always() && !cancelled() && needs.refresh.result == 'success' && needs.deploy.result == 'failure'
    needs: [refresh, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore the last verified JSON
        run: cp data/last-published.json public/v1/programs.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-rollback
          path: public
          retention-days: 1
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback
      - name: Record rollback
        run: |
          python -c "import json; from pathlib import Path; p=Path('data/update-result.json'); r=json.loads(p.read_text()); r.update(status='rolled_back', publicationVerified=False, error='Pages deployment or verification failed; previous verified JSON restored'); p.write_text(json.dumps(r,ensure_ascii=False,indent=2))"
          git config user.name 'minogasa-night[bot]'
          git config user.email 'minogasa-night[bot]@users.noreply.github.com'
          git add public/v1/programs.json data/update-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Roll back unverified Pages publication'
            git push
          fi
          echo "Publication failed and rollback was attempted. See failed deploy job." >> "$GITHUB_STEP_SUMMARY"
